name: Showtime monitor

on:
  schedule:
    # Each run keeps checking every 2 minutes for 50 minutes.
    # A new run is queued every 15 minutes and starts as soon as the
    # current one finishes, so there is no gap even when GitHub runs late.
    # Odd minutes avoid the top-of-the-hour rush when GitHub drops the most runs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # needed to save the latest snapshot back to the repo

concurrency:
  group: showtime-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check showtimes
        env:
          WATCH_URL: ${{ vars.WATCH_URL }}
          WATCH_LOCATION: ${{ vars.WATCH_LOCATION }}
          WATCH_DATES: ${{ vars.WATCH_DATES }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_MINUTES: "50"
          CHECK_EVERY_SECONDS: "120"
        run: python monitor.py

      - name: Save snapshot
        if: always()
        run: |
          git config user.name "showtime-monitor"
          git config user.email "showtime-monitor@users.noreply.github.com"
          git add snapshot.txt
          if git diff --cached --quiet; then
            echo "Nothing to save."
          else
            git commit -m "Update snapshot"
            git push
          fi
